name: check

# The first CI in this repository.
#
# Before it, nothing verified the skill against the product it describes. Measured 2026-09-17:
# 21 tool names that no longer existed, and 25 of 88 live tools covered, with two entire domains
# unmentioned. No test, build or typecheck could have said so, because a Markdown skill has none
# of those. This is the whole safety net, so it runs on every push.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `npm ci` and not `npm install`: the point is to check the skill against the EXACT
      # published @contenthero/mcp the lockfile pins, not whatever floats in today.
      # `.npmrc` reads the private @contenthero-ai scope (the spelling gate) with NPM_TOKEN. Without it every
      # run failed at `npm ci` with E401 from 2026-09-19 on, so no check ran and no release could build.
      # PACKAGES_READ_TOKEN is the org-level read:packages secret the other repos' CI already uses.
      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: npm run check
      # The open Agent Skills spec, checked by its own reference validator. Every upload host enforces
      # it, and nothing else here would notice a description over 1,024 characters or a frontmatter
      # key the spec does not allow: both shipped for a week before a real upload caught them.
      - uses: astral-sh/setup-uv@v5
      - run: npm run check:spec
