name: release

# Publishes the uploadable skill package as a GitHub Release asset on every version tag.
#
# Chat apps (claude.ai, ChatGPT, Gemini) install a skill by uploading it, so members need a file,
# not a repository. The stable links every install surface points at are:
#   https://github.com/contenthero-ai/skills/releases/latest/download/contenthero.zip
#   https://github.com/contenthero-ai/skills/releases/latest/download/contenthero-plugin.zip
# The first is the bare skill (skill uploads), the second the plugin with its connector (plugin
# uploads). Both are built here from the tagged commit, never by hand, so they cannot drift.
#
# To release: bump VERSION, package.json and plugin.json (`npm run check:skill` refuses a mismatch),
# run `npm run build:skill`, commit,
# then push a tag `v<VERSION>`.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
      # `.npmrc` reads the private @contenthero-ai scope (the spelling gate) with NPM_TOKEN. Without it every
      # run failed at `npm ci` with E401 from 2026-09-19 on, so no check ran and no release could build.
      # GITHUB_TOKEN reads the package once the package grants this repository Actions access (package
      # settings, Manage Actions access). PACKAGES_READ_TOKEN, if set as a secret here, is the fallback: the
      # same read:packages credential the private repos' CI uses.
      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - run: npm run check
      - run: npm run check:spec
      # A tag that disagrees with VERSION would publish a zip labeled one version containing another.
      - name: Tag matches VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)" || { echo "tag ${GITHUB_REF_NAME} != v$(cat VERSION)"; exit 1; }
      - run: npm run build:zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/contenthero.zip
            dist/contenthero-plugin.zip
          generate_release_notes: true
